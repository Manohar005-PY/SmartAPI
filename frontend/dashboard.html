<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Smart API Health Monitor</title>
  <meta name="description" content="Real-time API health monitoring dashboard with intelligent alerting.">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ── Header ── -->
  <header class="glass-header fade-in">
    <div class="logo">
      <h2 class="gradient-text">⚡ API Health Monitor</h2>
      <p id="sessionUser" class="session-user"></p>
    </div>
    <div class="header-actions">
      <div class="live-badge">
        <span class="live-dot"></span>
        Live
      </div>
      <button class="primary-btn pulse-btn" id="openAddModalBtn">+ Add API</button>
      <button class="secondary-btn" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main class="container">

    <!-- API Cards -->
    <p class="section-title">Monitored Endpoints</p>
    <section class="cards-section">
      <div id="apiCardsContainer" class="cards-grid">
        <!-- Skeleton loading state -->
        <div class="api-card" style="opacity:0.4">
          <div class="card-header">
            <div class="skeleton" style="height:18px;width:60%"></div>
            <div class="skeleton" style="height:22px;width:60px;border-radius:20px"></div>
          </div>
          <div class="card-metrics">
            <div class="metric-row"><div class="skeleton" style="height:14px;width:100%"></div></div>
            <div class="metric-row"><div class="skeleton" style="height:14px;width:80%"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Chart -->
    <p class="section-title">Response Time Analytics</p>
    <section class="chart-section glass-panel fade-in">
      <div class="graph-container">
        <canvas id="responseChart"></canvas>
      </div>
      <p class="chart-subtitle">Historical response times of monitored APIs — refreshes every 5 s</p>
    </section>

  </main>

  <!-- ── Add API Modal ── -->
  <div id="addApiModal" class="modal-overlay hidden">
    <div class="modal-content glass-panel bounce-in">
      <span class="close-btn" id="closeAddModalBtn" title="Close">&times;</span>
      <h3 class="gradient-text">Add New API</h3>

      <form id="addApiForm">
        <div class="form-group">
          <label for="name">API Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. User Service">
        </div>
        <div class="form-group">
          <label for="url">Endpoint URL</label>
          <input type="url" id="url" name="url" required placeholder="https://api.example.com/health">
        </div>
        <div class="form-group">
          <label for="interval">Check Interval (seconds)</label>
          <input type="number" id="interval" name="interval" value="60" min="5" required>
        </div>
        <div class="form-group">
          <label for="threshold">Slow Threshold (ms)</label>
          <input type="number" id="threshold" name="threshold" value="1000" min="10" required>
        </div>
        <button type="submit" class="primary-btn submit-btn">Start Monitoring →</button>
      </form>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
